name: Build Once
run-name: Building Docker file once
on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag is mutable. The trailing
# comment records the release; Dependabot updates both together.
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits through the API.
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs history to scan past commits
      - name: Shellcheck
        run: |
          shellcheck root/etc/s6-overlay/s6-rc.d/*/run root/defaults/ytdl.sh \
            root/app/hotfolder/watch.sh tests/smoke.sh
      - name: Python syntax
        run: python3 -m py_compile root/app/webui/server.py
      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off --requirement requirements.txt
      - name: Unraid template
        run: python3 -c "import xml.dom.minidom as m; m.parse('unraid/tdld.xml')"
      - name: Build the image for the smoke test
        run: docker build -t tdld:smoke -f dockerfile .
      - name: Smoke test
        run: tests/smoke.sh tdld:smoke
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Nothing reaches the registry unless the checks pass first.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Branches are built for all platforms but not pushed, so they leave no
      # image tags behind; only main publishes.
      PUBLISH: ${{ github.ref_name == 'main' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: tag
        # The branch name goes through env, never into the script itself:
        # a crafted name could otherwise run commands.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            # Docker tags can't contain "/", which branch names often do.
            echo "tag=$(printf '%s' "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(cat VERSION)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Builds from main also get version tags: the major (2) moves with
          # every build, the full version (2.0.0) is only set by the first
          # build of that VERSION and never overwritten afterwards.
          if [ "$REF_NAME" = "main" ]; then
            echo "major=$(cut -d. -f1 VERSION)" >> "$GITHUB_OUTPUT"
            if docker buildx imagetools inspect "ghcr.io/tom-joad/tdld:$(cat VERSION)" >/dev/null 2>&1; then
              echo "ghcr.io/tom-joad/tdld:$(cat VERSION) exists, keeping it"
            else
              echo "release=$(cat VERSION)" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          no-cache: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            BUILD_DATE=${{ steps.tag.outputs.build_date }}
          tags: |
            ghcr.io/tom-joad/tdld:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.release && format('ghcr.io/tom-joad/tdld:{0}', steps.tag.outputs.release) || '' }}
            ${{ steps.tag.outputs.major && format('ghcr.io/tom-joad/tdld:{0}', steps.tag.outputs.major) || '' }}
      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless, GitHub OIDC)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          IMAGE: ghcr.io/tom-joad/tdld
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Scan the built image
        if: ${{ env.PUBLISH == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/tom-joad/tdld@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report only: a new base-image CVE shouldn't block a fix from shipping
