name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post the content of your `cookies.txt`.** It logs in to your
        YouTube account, and an issue is public.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`docker inspect -f '{{ index .Config.Labels \"build_version\" }}' tdld`"
      placeholder: "TDLD version: 2.0.0-…"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [downloads, web UI, hotfolder, start-up / permissions, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The container log (`docker logs tdld`) around the problem.
      render: text
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: How you run it (Unraid, Synology, docker compose), PUID/PGID/UMASK and the settings you changed.
